{% extends "base.html" %}

{% block content %}
<div class="max-w-md mx-auto mt-10 p-6 border border-gray-200 rounded shadow">
    <h2 class="text-2xl font-bold mb-2 text-center">Edit Your Review</h2>
    <p class="text-sm text-gray-500 text-center mb-6">for {{ object.restaurant.name }}</p>
    <form method="post" class="space-y-4">
        {% csrf_token %}
        {% for field in form %}
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">{{ field.label }}</label>
            {% if field.name == 'comment' %}
            <textarea name="{{ field.html_name }}" id="{{ field.id_for_label }}" rows="4"
                      class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">{% if field.value %}{{ field.value }}{% endif %}</textarea>
            {% else %}
            <input type="number" name="{{ field.html_name }}" id="{{ field.id_for_label }}" min="1" max="5"
                   class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
                   {% if field.value %}value="{{ field.value }}"{% endif %}>
            {% endif %}
            {% if field.errors %}
            <p class="text-xs text-red-600 mt-1">{{ field.errors.0 }}</p>
            {% endif %}
        </div>
        {% endfor %}
        <button type="submit" class="w-full bg-blue-500 hover:bg-blue-600 text-white font-medium px-4 py-2 rounded">Save Changes</button>
    </form>
</div>
{% endblock %}
