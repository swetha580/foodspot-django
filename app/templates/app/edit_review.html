{% extends "base.html" %}

{% block content %}
<div class="max-w-md mx-auto mt-10 p-6 border border-gray-200 rounded shadow">
    <h2 class="text-2xl font-bold mb-2 text-center">Edit Your Review</h2>
    <p class="text-sm text-gray-500 text-center mb-6">for {{ object.restaurant.name }}</p>
    <form method="post" class="space-y-4" x-data="{ rating: {{ form.rating.value|default:object.rating }} }">
        {% csrf_token %}
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Rating</label>
            <div class="flex gap-1">
                <template x-for="star in [1,2,3,4,5]" :key="star">
                    <button type="button" @click="rating = star" class="text-3xl focus:outline-none"
                            :class="star <= rating ? 'text-yellow-400' : 'text-gray-300'">
                        ★
                    </button>
                </template>
            </div>
            <input type="hidden" name="rating" :value="rating">
            {% if form.rating.errors %}
            <p class="text-xs text-red-600 mt-1">{{ form.rating.errors.0 }}</p>
            {% endif %}
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Comment</label>
            <textarea name="comment" rows="4"
                      class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">{% if form.comment.value %}{{ form.comment.value }}{% else %}{{ object.comment }}{% endif %}</textarea>
            {% if form.comment.errors %}
            <p class="text-xs text-red-600 mt-1">{{ form.comment.errors.0 }}</p>
            {% endif %}
        </div>
        <button type="submit" class="w-full bg-blue-500 hover:bg-blue-600 text-white font-medium px-4 py-2 rounded">Save Changes</button>
    </form>
</div>
{% endblock %}
