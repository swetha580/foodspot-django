{% extends "base.html" %}

{% block content %}
<div class="max-w-md mx-auto mt-10 p-6 border border-gray-200 rounded shadow">
    <h2 class="text-2xl font-bold mb-6 text-center">Reset Password</h2>
    <p class="text-sm text-gray-600 mb-4">Enter your email address and we'll send you a link to reset your password.</p>
    <form method="post" class="space-y-4">
        {% csrf_token %}
        {% for field in form %}
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">{{ field.label }}</label>
            {{ field }}
            {% if field.errors %}
            <p class="text-xs text-red-600 mt-1">{{ field.errors.0 }}</p>
            {% endif %}
        </div>
        {% endfor %}
        <button type="submit" class="w-full bg-blue-500 hover:bg-blue-600 text-white font-medium px-4 py-2 rounded">Send Reset Link</button>
    </form>
</div>
{% endblock %}
