{% extends "base.html" %}

{% block content %}
<div class="max-w-md mx-auto mt-10 p-6 border border-gray-200 rounded shadow text-center">
    <h2 class="text-2xl font-bold mb-4">Delete Review?</h2>
    <p class="text-sm text-gray-600 mb-6">
        Are you sure you want to delete your review for
        <span class="font-semibold">{{ object.restaurant.name }}</span>? This cannot be undone.
    </p>
    <form method="post">
        {% csrf_token %}
        <div class="flex justify-center gap-4">
            <a href="{% url 'restaurant_detail' object.restaurant.pk %}" class="px-4 py-2 rounded border border-gray-300 text-gray-700 hover:bg-gray-50">Cancel</a>
            <button type="submit" class="px-4 py-2 rounded bg-red-500 hover:bg-red-600 text-white font-medium">Delete</button>
        </div>
    </form>
</div>
{% endblock %}
